schema_version: "1.1"
name: run-plan-not-auto
description: Asking to implement a plan without typing /sdd-engineering:run-plan never invokes the run-plan skill (disable-model-invocation).
tags: [single-arm, read-only]
runs: 2
plugins: ["../..", "../../../engineering-paved-path", "../../../research-tools", "../../../architecture-review"]
execution:
  prompt: "Implement the plan in specs/due-date/plan.md."
  max_turns: 6
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: run-plan-not-invoked
    type: tool_used
    tool: Skill
    input_match: 'run-plan'
    min: 0
    max: 0
    arm: both
